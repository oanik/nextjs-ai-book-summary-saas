name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: mysql://bookwise:bookwise@127.0.0.1:3306/bookwise
      GOOGLE_CLIENT_ID: ci-placeholder-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
      AUTH_SECRET: ci-placeholder-auth-secret
      OPENAI_API_KEY: sk-ci-placeholder
      OPENAI_BOOK_SUMMARY_MODEL: gpt-4o-mini
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Oracle Cloud VM
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "export REPO_DIR='${{ secrets.DEPLOY_PATH }}' BRANCH='${{ github.ref_name }}'; bash '${{ secrets.DEPLOY_PATH }}/scripts/deploy-production.sh'"
